services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cedarstone}
      POSTGRES_USER: ${POSTGRES_USER:-cedarstone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cedarstone-dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cedarstone} -d ${POSTGRES_DB:-cedarstone}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cedarstone}:${POSTGRES_PASSWORD:-cedarstone-dev}@db:5432/${POSTGRES_DB:-cedarstone}
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-me}
      MODEL_DIR: /models
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173
    volumes:
      - ${LOCAL_MODEL_DIR:-./backend/models}:/models:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8001/api/v1
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:

